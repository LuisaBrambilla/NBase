<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site em construção</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .maintenance {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .maintenance-card {
        max-width: 720px;
        width: 100%;
        background: var(--bg-panel);
        border: 1px solid var(--border-soft);
        border-radius: 20px;
        padding: 32px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      }
      .maintenance-card img {
        width: 180px;
        height: auto;
        margin-bottom: 16px;
      }
      .maintenance-card h1 {
        margin: 0 0 10px;
        font-size: 26px;
      }
      .maintenance-card p {
        margin: 0;
        color: var(--text-muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body class="no-sidebar light">
    <main class="maintenance">
      <div class="maintenance-card">
        <img
          src="./Gen360.png"
          alt="Gen360"
        />
        <h1>Site em construção</h1>
        <p>Estamos preparando uma nova experiência. Em breve estaremos no ar.</p>
      </div>
    </main>
  </body>
</html>
