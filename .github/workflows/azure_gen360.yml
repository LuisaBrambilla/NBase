# Docs: https://github.com/Azure/webapps-deploy
# Um único job evita upload-artifact (cota de armazenamento do GitHub Actions).

name: Build and deploy Python app to Azure Web App - Gen360

on:
  push:
    branches:
      - azure
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Prepare deployment folder
        run: |
          mkdir -p deploy
          rsync -a --exclude='antenv' --exclude='data' --exclude='.git' --exclude='venv' --exclude='resolucoes_arespcj' \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='.env' \
            . deploy/

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "Gen360"
          slot-name: "Production"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_684D7487439D4A81AB7F8CED56CAF651 }}
          package: deploy
